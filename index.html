<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kho Game HTML5</title>
<meta name="description" content="Kho game HTML5 chơi ngay trên trình duyệt, không cần cài đặt.">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #0f1220; --card: #1a1f35; --line: #2a3150; --text: #e8eaf6; --muted: #8e95b8; --accent: #7c5cff; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 30px; font-weight: 800; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 4px 0 18px; font-size: 15px; }
  .search { position: relative; margin-bottom: 12px; }
  .search input {
    width: 100%; padding: 14px 16px 14px 44px; font-size: 16px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  .search::before { content: "🔍"; position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 16px; }
  .tags { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 16px; scrollbar-width: none; }
  .tags::-webkit-scrollbar { display: none; }
  .tag {
    flex: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); font-size: 14px; cursor: pointer;
  }
  .tag.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .count { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card {
    display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden; text-decoration: none; color: inherit; transition: transform .15s, border-color .15s;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .thumb { height: 110px; display: flex; align-items: center; justify-content: center; font-size: 52px; }
  .info { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .info h3 { font-size: 17px; }
  .info p { color: var(--muted); font-size: 13px; line-height: 1.4; flex: 1; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; }
  .meta span { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: var(--line); color: var(--muted); }
  .meta .new { background: #ff5c8a; color: #fff; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; display: none; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 40px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎮 Kho Game <span>HTML5</span></h1>
  <p class="sub">Chơi ngay trên trình duyệt, không cần cài đặt</p>

  <div class="search"><input id="q" type="search" placeholder="Tìm game..." autocomplete="off"></div>
  <div class="tags" id="tags"></div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">Không tìm thấy game nào 😢</div>

  <footer>Làm bằng HTML5 + JavaScript</footer>
</div>

<script src="games.js"></script>
<script>
const games = (window.GAMES || []).slice().sort((a, b) => (b.added || "").localeCompare(a.added || ""));
const $ = id => document.getElementById(id);
const norm = s => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isNew = g => g.added && (Date.now() - new Date(g.added)) / 864e5 < 14;

let activeTag = "Tất cả";
const params = new URLSearchParams(location.search);
$("q").value = params.get("q") || "";
if (params.get("tag")) activeTag = params.get("tag");

function renderTags() {
  const all = ["Tất cả", ...new Set(games.flatMap(g => g.tags || []))];
  $("tags").innerHTML = all.map(t => `<button class="tag${t === activeTag ? " on" : ""}" data-t="${esc(t)}">${esc(t)}</button>`).join("");
}

function render() {
  const q = norm($("q").value.trim());
  const list = games.filter(g =>
    (activeTag === "Tất cả" || (g.tags || []).includes(activeTag)) &&
    (!q || norm([g.name, g.desc, ...(g.tags || [])].join(" ")).includes(q))
  );
  $("grid").innerHTML = list.map(g => `
    <a class="card" href="games/${encodeURIComponent(g.id)}/">
      <div class="thumb" style="background:${esc(g.color || "#333")}">${esc(g.icon || "🎮")}</div>
      <div class="info">
        <h3>${esc(g.name)}</h3>
        <p>${esc(g.desc || "")}</p>
        <div class="meta">${isNew(g) ? '<span class="new">MỚI</span>' : ""}${(g.tags || []).map(t => `<span>${esc(t)}</span>`).join("")}</div>
      </div>
    </a>`).join("");
  $("count").textContent = `${list.length} / ${games.length} game`;
  $("empty").style.display = list.length ? "none" : "block";
  const p = new URLSearchParams();
  if ($("q").value.trim()) p.set("q", $("q").value.trim());
  if (activeTag !== "Tất cả") p.set("tag", activeTag);
  history.replaceState(null, "", p.toString() ? "?" + p : location.pathname);
}

$("tags").addEventListener("click", e => {
  const b = e.target.closest(".tag"); if (!b) return;
  activeTag = b.dataset.t; renderTags(); render();
});
$("q").addEventListener("input", render);
renderTags(); render();
</script>
</body>
</html>
