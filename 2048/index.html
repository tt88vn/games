<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>2048</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #faf8ef; color: #776e65;
    min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
    padding: 20px 12px; touch-action: none; user-select: none;
  }
  .wrap { width: 100%; max-width: 440px; }
  .back { display: inline-block; margin-bottom: 8px; color: #8f7a66; font-weight: 700; text-decoration: none; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  h1 { font-size: 56px; font-weight: 800; }
  .scores { display: flex; gap: 6px; }
  .score { background: #bbada0; color: #fff; border-radius: 6px; padding: 6px 14px; text-align: center; min-width: 70px; }
  .score small { display: block; font-size: 11px; color: #eee4da; text-transform: uppercase; }
  .score b { font-size: 20px; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; }
  .bar p { font-size: 15px; }
  button {
    background: #8f7a66; color: #f9f6f2; border: 0; border-radius: 6px;
    padding: 10px 16px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .board {
    position: relative; background: #bbada0; border-radius: 8px;
    width: 100%; aspect-ratio: 1; padding: 3%;
  }
  .grid, .tiles { position: absolute; inset: 3%; }
  .cell, .tile { position: absolute; width: 22.75%; height: 22.75%; border-radius: 5px; }
  .cell { background: rgba(238,228,218,.35); }
  .tile {
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; transition: left .1s, top .1s;
  }
  .tile.new { animation: pop .18s; }
  .tile.merged { animation: bump .18s; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes bump { 50% { transform: scale(1.15); } }
  .overlay {
    position: absolute; inset: 0; border-radius: 8px; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: rgba(238,228,218,.75); z-index: 10;
  }
  .overlay.show { display: flex; }
  .overlay h2 { font-size: 40px; }
  .hint { margin-top: 14px; font-size: 14px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← Kho game</a>
  <header>
    <h1>2048</h1>
    <div class="scores">
      <div class="score"><small>Điểm</small><b id="score">0</b></div>
      <div class="score"><small>Cao nhất</small><b id="best">0</b></div>
    </div>
  </header>
  <div class="bar">
    <p>Ghép các ô để được <b>2048</b>!</p>
    <button id="newBtn">Chơi mới</button>
  </div>
  <div class="board" id="board">
    <div class="grid" id="grid"></div>
    <div class="tiles" id="tiles"></div>
    <div class="overlay" id="overlay">
      <h2 id="msg"></h2>
      <button id="againBtn">Chơi lại</button>
    </div>
  </div>
  <p class="hint">Vuốt màn hình hoặc dùng phím mũi tên / WASD</p>
</div>

<script>
const N = 4;
const COLORS = {
  2: ["#eee4da", "#776e65"], 4: ["#ede0c8", "#776e65"], 8: ["#f2b179", "#f9f6f2"],
  16: ["#f59563", "#f9f6f2"], 32: ["#f67c5f", "#f9f6f2"], 64: ["#f65e3b", "#f9f6f2"],
  128: ["#edcf72", "#f9f6f2"], 256: ["#edcc61", "#f9f6f2"], 512: ["#edc850", "#f9f6f2"],
  1024: ["#edc53f", "#f9f6f2"], 2048: ["#edc22e", "#f9f6f2"]
};
const $ = id => document.getElementById(id);
let grid, score, best, won, keepPlaying, nextId;

function store(key, val) {
  try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) { return null; }
}

// Draw background cells once
for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
  const d = document.createElement("div");
  d.className = "cell"; place(d, r, c); $("grid").appendChild(d);
}
function place(el, r, c) {
  el.style.left = (c * 25.75) + "%";
  el.style.top = (r * 25.75) + "%";
}

function newGame() {
  grid = Array.from({ length: N }, () => Array(N).fill(null));
  score = 0; won = false; keepPlaying = false; nextId = 1;
  best = +store("best2048") || 0;
  $("tiles").innerHTML = "";
  $("overlay").classList.remove("show");
  addRandom(); addRandom();
  render();
}

function addRandom() {
  const empty = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) empty.push([r, c]);
  if (!empty.length) return;
  const [r, c] = empty[Math.floor(Math.random() * empty.length)];
  grid[r][c] = { id: nextId++, v: Math.random() < 0.9 ? 2 : 4, isNew: true };
}

function move(dir) { // 0 up, 1 right, 2 down, 3 left
  if ($("overlay").classList.contains("show")) return;
  let moved = false;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c]) {
    grid[r][c].isNew = false; grid[r][c].merged = false;
  }
  const removed = [];
  for (let i = 0; i < N; i++) {
    // collect line in movement direction
    const pos = [];
    for (let j = 0; j < N; j++) {
      if (dir === 0) pos.push([j, i]);
      if (dir === 2) pos.push([N - 1 - j, i]);
      if (dir === 3) pos.push([i, j]);
      if (dir === 1) pos.push([i, N - 1 - j]);
    }
    const line = pos.map(([r, c]) => grid[r][c]).filter(Boolean);
    const out = [];
    for (let k = 0; k < line.length; k++) {
      if (k + 1 < line.length && line[k].v === line[k + 1].v) {
        const t = line[k]; t.v *= 2; t.merged = true;
        removed.push(line[k + 1]);
        score += t.v;
        if (t.v === 2048 && !won) won = true;
        out.push(t); k++;
      } else out.push(line[k]);
    }
    pos.forEach(([r, c], j) => {
      const t = out[j] || null;
      if (grid[r][c] !== t) moved = true;
      grid[r][c] = t;
    });
  }
  if (!moved) return;
  removed.forEach(t => { const el = document.querySelector(`[data-id="${t.id}"]`); if (el) el.remove(); });
  addRandom();
  if (score > best) { best = score; store("best2048", best); }
  render();
  if (won && !keepPlaying) return showMsg("Bạn thắng! 🎉", true);
  if (!canMove()) showMsg("Hết nước đi!");
}

function canMove() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const t = grid[r][c];
    if (!t) return true;
    if (c + 1 < N && grid[r][c + 1] && grid[r][c + 1].v === t.v) return true;
    if (r + 1 < N && grid[r + 1][c] && grid[r + 1][c].v === t.v) return true;
  }
  return false;
}

function showMsg(text, win) {
  $("msg").textContent = text;
  $("againBtn").textContent = win ? "Chơi tiếp" : "Chơi lại";
  $("againBtn").onclick = win ? () => { keepPlaying = true; $("overlay").classList.remove("show"); } : newGame;
  $("overlay").classList.add("show");
}

function render() {
  const size = $("tiles").clientWidth * 0.2275;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const t = grid[r][c]; if (!t) continue;
    let el = document.querySelector(`[data-id="${t.id}"]`);
    if (!el) { el = document.createElement("div"); el.dataset.id = t.id; $("tiles").appendChild(el); }
    el.className = "tile" + (t.isNew ? " new" : "") + (t.merged ? " merged" : "");
    const [bg, fg] = COLORS[t.v] || ["#3c3a32", "#f9f6f2"];
    el.style.background = bg; el.style.color = fg;
    el.style.fontSize = (size * (t.v < 100 ? 0.5 : t.v < 1000 ? 0.4 : 0.32)) + "px";
    el.textContent = t.v;
    place(el, r, c);
  }
  $("score").textContent = score;
  $("best").textContent = best;
}

// Keyboard
const KEYS = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3, w: 0, d: 1, s: 2, a: 3 };
document.addEventListener("keydown", e => {
  const d = KEYS[e.key] ?? KEYS[e.key.toLowerCase()];
  if (d !== undefined) { e.preventDefault(); move(d); }
});

// Touch / swipe
let sx, sy;
document.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
document.addEventListener("touchend", e => {
  if (sx === undefined) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  sx = undefined;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
});

$("newBtn").onclick = newGame;
window.addEventListener("resize", render);
newGame();
</script>
</body>
</html>
